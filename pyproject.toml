[project]
name = "store-assistant"
version = "0.1.0"
description = "Conversational LLM agent that saves and retrieves store records with a passphrase-gated lookup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genai-prices>=0.1.11",
    "phonenumbers>=9.0.41",
    "pydantic-ai-slim[anthropic,logfire]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
store-assistant = "store_assistant.cli:app"

[project.optional-dependencies]
web = [
    "streamlit>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/store_assistant", "tests"]
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
